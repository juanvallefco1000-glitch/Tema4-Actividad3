name: Docker CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  docker-compose-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker
        run: |
          docker --version
          docker compose version

      - name: Construir servicios con Docker Compose
        run: docker compose build

      - name: Levantar stack
        run: docker compose up -d

      - name: Esperar inicio de servicios
        run: sleep 20

      - name: Mostrar contenedores activos
        run: docker compose ps

      - name: Probar API principal
        run: |
          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/health

      - name: Probar endpoint de tareas
        run: |
          curl --fail http://localhost:3000/tasks

      - name: Mostrar logs
        if: always()
        run: docker compose logs

      - name: Apagar stack
        if: always()
        run: docker compose down